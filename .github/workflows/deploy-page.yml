name: Deploy to GitHub Pages

# The page lives in project-page/ next to the code and data,
# so only changes there (or to this file) trigger a redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'project-page/**'
      - '.github/workflows/deploy-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-page/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # base_path is "/<repo>" for project sites and "" for user sites / custom domains,
      # so links and images work in every case without editing astro.config.mjs.
      - name: Build (includes broken-asset check)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Set the repository variable PAPER_STRICT=1 (Settings → Secrets and variables → Actions → Variables)
          # to block deploys while template placeholder content is still in paper.ts.
          PAPER_STRICT: ${{ vars.PAPER_STRICT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project-page/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
